services:
  mongodb:
    image: mongo:4.4
    container_name: taskforge-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - taskforge-mongodb-data:/data/db

  backend:
    build:
      context: ./server
    container_name: taskforge-backend
    restart: unless-stopped
    depends_on:
      - mongodb
      - analytics
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/taskforge
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting Docker Compose}
      ANALYTICS_SERVICE_URL: http://analytics:8000
      ANALYTICS_TIMEOUT_MS: 3000

  analytics:
    build:
      context: ./analytics
    container_name: taskforge-analytics
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./client
    container_name: taskforge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  taskforge-mongodb-data:
